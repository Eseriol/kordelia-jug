server:
  port: 8080

spring:
  application:
    name: kordelia-demo
  threads:
    virtual:
      enabled: true
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.5-flash

resilience4j:
  retry:
    instances:
      aiProvider:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      aiProvider:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
  bulkhead:
    instances:
      aiProvider:
        max-concurrent-calls: 3
        max-wait-duration: 45s

logging:
  level:
    pl.kordelia: INFO
